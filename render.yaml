services:
  - type: web
    name: traceseal
    runtime: python
    pythonVersion: "3.13.0"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: TRACESEAL_SECRET
        generateValue: true
      - key: TRACESEAL_MASTER_KEY
        generateValue: true
      - key: PQC_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.13.0"
