<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="4"/>
  
  <!-- Outer Shield Glow -->
  <path d="M256 80 L380 135 C380 270 320 375 256 425 C192 375 132 270 132 135 Z" 
        fill="none" stroke="url(#glowGrad)" stroke-width="18" filter="url(#glow)" stroke-linejoin="round"/>
  
  <!-- Core Shield -->
  <path d="M256 80 L380 135 C380 270 320 375 256 425 C192 375 132 270 132 135 Z" 
        fill="rgba(6, 182, 212, 0.08)" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Inner Circuit / Keyhole / Seal Symbol -->
  <!-- Document Sheet -->
  <rect x="206" y="165" width="100" height="135" rx="10" fill="rgba(255,255,255,0.06)" stroke="#38bdf8" stroke-width="6"/>
  <!-- Fold corner -->
  <path d="M276 165 L306 195 L276 195 Z" fill="#38bdf8"/>
  
  <!-- Lock Core inside Document -->
  <rect x="226" y="235" width="60" height="45" rx="8" fill="#06b6d4"/>
  <path d="M236 235 V215 C236 205 276 205 276 215 V235" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="253" r="5" fill="#0a0f1d"/>
  <path d="M256 256 V268" stroke="#0a0f1d" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Watermark Provenance Fingerprint Rings -->
  <circle cx="256" cy="355" r="8" fill="#22d3ee"/>
  <circle cx="256" cy="355" r="20" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="256" cy="355" r="32" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-width="3" stroke-dasharray="8,6"/>
</svg>